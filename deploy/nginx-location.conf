# Bugs & Lizards: two locations, installed as /etc/nginx/snippets/bugs-and-lizards.conf and pulled into the
# host's 443 server block with one line:  include /etc/nginx/snippets/bugs-and-lizards.conf;
# No zones, maps, upstreams or other http-level names. No add_header, so the server block's headers still apply.
# Single-threaded export, so no COOP/COEP headers are needed.
# Before installing: `grep -n wasm /etc/nginx/mime.types`; if wasm is NOT mapped, add inside the first location:
#   types { application/wasm wasm; text/html html; application/javascript js; application/octet-stream pck; image/png png; }
# Before and after: `nginx -T | sha256sum` of the other hosts' blocks; `nginx -t` rc 0; reload, never restart.
# Rollback: move the snippet aside (not rm), remove the include line, nginx -t, reload.

# The game page and its files (the stock Godot web export).
location /bugs-and-lizards/ {
	alias /srv/bugs-and-lizards/www/;
	index index.html;
	gzip on;
	gzip_types application/wasm application/javascript application/octet-stream text/css;
	try_files $uri $uri/ =404;
}

# The game's WebSocket, to the headless server on loopback.
location = /bugs-and-lizards/ws {
	proxy_pass http://127.0.0.1:3311;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
}
